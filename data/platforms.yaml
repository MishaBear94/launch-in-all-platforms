# Launch platforms and startup directories.
#
# Observed while submitting one SaaS product to ~70 of these in October 2026.
# Platforms change their rules often: treat every entry as "last seen on <verified>" and
# update it when a form looks different. PRs welcome.
#
# Fields
#   id            stable key
#   name, url     platform name and homepage
#   submit        submit / new-product URL
#   login         sign-in methods: google | github | email_link | password | apple | shop | none
#   family        shared software/template, see docs/platform-families.md (same family = same agent flow)
#   kind          launch (weekly/daily board with votes) | directory (listing only) | hybrid
#   free          null when there is no free tier, otherwise:
#     requires    badge | badge_optional (dofollow/priority only) | upvotes:N | comments:N | review | newsletter | dr_min:N
#     wait        typical wait / queue for the free tier
#   paid          cheapest paid option seen (USD, one-time unless noted)
#   votes         now | at_launch | none   (does the public product page take upvotes)
#   listing       public listing URL pattern ({slug})
#   badge_rules   anything special about the badge link
#   notes         what tripped the agent
#   verified      date last checked

- id: producthunt
  name: Product Hunt
  url: https://www.producthunt.com
  kind: launch
  login: [google, github, apple, email_link]
  free: {requires: [review], wait: "pick a day"}
  paid: null
  votes: at_launch
  notes: "The reference platform; launch day needs a hunter/maker plan. Not part of the automated batch — plan it separately."
  verified: null

