copy:
  tagline_40: Marketing hooks from industry news
  tagline_60: Turn industry news into your next marketing hook
  tagline_80: Turn industry news into sourced, product-relevant marketing hooks
  one_liner_150: Turn industry news into product-relevant marketing hooks. DailyHook AI researches your market and delivers sourced briefs for founders, marketers and.
  meta_120_170: Turn industry news into product-relevant marketing hooks. DailyHook AI researches your market and delivers sourced briefs for founders, marketers and AI agents.
  short_300: 'DailyHook AI turns what''s happening in your industry into marketing opportunities for your product. Start with your website: it builds product knowledge, watches for relevant news, skips
    stories you''ve already covered, and delivers sourced briefs your team or AI agent can build on.'
  long_600: 'DailyHook AI turns what''s happening in your industry into marketing opportunities for your product. Start with your website: it builds product knowledge, watches for relevant news, skips stories
    you''ve already covered, and delivers sourced briefs your team or AI agent can build on. Free to start: 2 research refreshes a week.'
  long_1000: 'Less news anxiety. More growth opportunities.


    DailyHook AI is GTM infrastructure for the AI era. It combines industry news with what it knows about your product and turns them into marketing hooks: a specific event, the angle for a specific audience,
    how your product connects to it, the argument to develop, and the evidence to add before publishing.


    How it works:

    1. Start with your website. DailyHook AI builds your product knowledge. You can add documents, correct facts and tell it what matters.

    2. New research on your schedule. It looks for relevant changes in your market and skips events already delivered for your product.

    3. Take the brief into your workflow. Every hook comes with sources and reasoning. Your writer or agent adds your voice.'
  long_1100: 'Less news anxiety. More growth opportunities.


    DailyHook AI is GTM infrastructure for the AI era. It combines industry news with what it knows about your product and turns them into marketing hooks: a specific event, the angle for a specific audience,
    how your product connects to it, the argument to develop, and the evidence to add before publishing.


    How it works:

    1. Start with your website. DailyHook AI builds your product knowledge. You can add documents, correct facts and tell it what matters.

    2. New research on your schedule. It looks for relevant changes in your market and skips events already delivered for your product.

    3. Take the brief into your workflow. Every hook comes with sources and reasoning. Your writer or agent adds your voice.


    Why not just ask a chatbot? A chat can find a story once. DailyHook AI keeps the product context and the recurring workflow around it: product knowledge and team directions stay with the product, and
    delivered stories are recorded so you don''t repeat yourself. It works alongside your agent rather than replacing it.


    Free to start: 2 research refreshes a week.'
